<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posts - Osman Sarper Kucuk</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1><a href="/">Osman Sarper Kucuk</a></h1>
    <nav>
      <a href="/posts">Posts</a> ·
      <a href="https://github.com/Osman-SK" target="_blank" rel="noopener noreferrer">GitHub</a> ·
      <a href="https://twitter.com/OSK546" target="_blank" rel="noopener noreferrer">X</a>
    </nav>
  </header>

  <hr />

  <main>
    <div id="posts-list"></div>
  </main>

  <script>
    async function loadPosts() {
      try {
        const response = await fetch('/posts-metadata.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const posts = await response.json();
        const postsList = document.getElementById('posts-list');
        
        if (!posts || posts.length === 0) {
          postsList.innerHTML = '<p>Coming...</p>';
          return;
        }
        
        const html = posts.map(post => {
          const tagsHtml = post.tags && post.tags.length > 0 
            ? `<span class="post-tags">${post.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}</span>`
            : '';
          return `
          <div class="post-item">
            <div class="post-left">
              <a href="/posts/${post.slug}.html" class="x-link post-title">${post.title}</a>
              ${tagsHtml}
            </div>
            <span class="date">${post.date}</span>
          </div>
          <p></p>
        `}).join('');
        
        postsList.innerHTML = html;
      } catch (error) {
        console.error('Failed to load posts:', error);
        document.getElementById('posts-list').innerHTML = '<p>Error loading posts.</p>';
      }
    }
    
    loadPosts();
  </script>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
