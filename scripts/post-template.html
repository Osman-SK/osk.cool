<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}} - Osman Sarper Kucuk</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .post-content h2,
    .post-content h3,
    .post-content h4,
    .post-content h5,
    .post-content h6 {
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .post-content h2 { font-size: 1.5rem; }
    .post-content h3 { font-size: 1.3rem; }
    .post-content p { margin-bottom: 1.75rem; }
    .post-content ul,
    .post-content ol {
      padding-left: 1.5rem;
      margin-bottom: 1.75rem;
    }
    .post-content li {
      margin-bottom: 0.5rem;
    }
    .post-content blockquote {
      border-left: 3px solid #444;
      padding-left: 1rem;
      margin-bottom: 1.75rem;
      color: #aaa;
    }
    .post-content pre {
      background: #1a1a1a;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      margin-bottom: 1.75rem;
    }
    .post-content code {
      background: #1a1a1a;
      padding: 0.15rem 0.3rem;
      border-radius: 3px;
      font-family: monospace;
    }
    .post-content pre code {
      padding: 0;
      background: none;
    }
    .post-content hr {
      margin: 2.5rem 0;
      border: 0;
      height: 1px;
      background: #333;
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">Osman Sarper Kucuk</a></h1>
    <nav>
      <a href="/posts">Posts</a> ·
      <a href="/links">Links</a>
    </nav>
  </header>

  <hr />

  <main>
    <article class="post">
      <h3>{{TITLE}}</h3>
      <p class="post-meta">
        <span class="date">{{DATE}}</span>
      </p>
      <hr />
      <div class="post-content">
        {{CONTENT}}
      </div>
    </article>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
