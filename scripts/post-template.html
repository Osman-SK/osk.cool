<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}} - Osman Sarper Kucuk</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .post-content h2,
    .post-content h3,
    .post-content h4,
    .post-content h5,
    .post-content h6 {
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .post-content h2 { font-size: 1.5rem; }
    .post-content h3 { font-size: 1.3rem; }
    .post-content p { margin-bottom: 1.75rem; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">Osman Sarper Kucuk</a></h1>
    <nav>
      <a href="/posts">Posts</a> ·
      <a href="https://github.com/Osman-SK" target="_blank" rel="noopener noreferrer">GitHub</a> ·
      <a href="https://twitter.com/OSK546" target="_blank" rel="noopener noreferrer">X</a>
    </nav>
  </header>

  <hr />

  <main>
    <article class="post">
      <h3>{{TITLE}}</h3>
      <p class="post-meta">
        <span class="date">{{DATE}}</span>
      </p>
      <hr />
      <div class="post-content">
        {{CONTENT}}
      </div>
    </article>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
